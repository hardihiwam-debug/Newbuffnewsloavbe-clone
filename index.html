<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Iran Desk" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Iran Desk Bot Console</title>
    <meta name="description" content="Private admin console for the Iran–U.S. conflict Telegram news bot." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Default is dark (the newsroom desk); light is opt-in via the toggle.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : true;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
